name: BookMyShow Ticket Tracker

on:
  # Scheduled cron execution (runs every 5 minutes — GitHub minimum)
  schedule:
    - cron: '*/5 * * * *'

  # Manual trigger with options for testing and forcing alerts
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send test Discord alert to verify webhook'
        required: false
        default: false
        type: boolean
      force_alert:
        description: 'Force alert even if tickets were previously flagged as live'
        required: false
        default: false
        type: boolean

# Required for committing state.json back to repository
permissions:
  contents: write

# Prevent concurrent runs from conflicting with git push
concurrency:
  group: bms-tracker
  cancel-in-progress: false

jobs:
  track-tickets:
    name: Check Ticket Availability
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tracker Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION || '@everyone' }}
          BMS_REGION: ${{ vars.BMS_REGION || 'karwar' }}
          TARGET_KEYWORDS: ${{ vars.TARGET_KEYWORDS || 'Ramayana,Ramayana: Part 1,Ramayana - Part 1' }}
          TEST_ALERT: ${{ inputs.test_alert || 'false' }}
          FORCE_ALERT: ${{ inputs.force_alert || 'false' }}
        run: node tracker.js

      - name: Commit and push state changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest (tracked-movies.json may have been updated by the UI)
          git pull --rebase origin main || true

          # Stage state.json and tracked-movies.json if changed
          CHANGED=0
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet state.json; then
              CHANGED=1
            fi
          fi
          if [ -f tracked-movies.json ]; then
            git add tracked-movies.json
            if ! git diff --cached --quiet tracked-movies.json; then
              CHANGED=1
            fi
          fi

          if [ "$CHANGED" = "1" ]; then
            echo "Changes detected. Committing..."
            git commit -m "chore(tracker): update ticket state [skip ci]" || true
            if ! git push origin main; then
              echo "::warning::Git push failed. Check 'Workflow permissions' → 'Read and write' in repo Settings → Actions → General."
            else
              echo "Successfully pushed state updates."
            fi
          else
            echo "No state changes to commit."
          fi
